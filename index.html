<!DOCTYPE html>
<html lang="en">
<head>

            padding: 0;
            box-sizing: border-box;

        body {

            background: linear-gradient(145deg, #0b1120, #19233c);
            padding: 1.5rem;

        .card {
            background: rgba(255, 255, 255, 0.06);
            backdrop-filter: blur(20px);
            border-radius: 2.5rem;
            padding: 2.5rem 2.8rem 3rem;
            max-width: 600px;
            width: 100%;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        .header {
            text-align: center;
            margin-bottom: 2rem;
        }
        .header .icon {
            font-size: 2.8rem;
            display: block;
            margin-bottom: 0.4rem;
        }
        .header h1 {
            font-size: 1.9rem;
            font-weight: 700;
            background: linear-gradient(135deg, #f0f4ff, #a0c0ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .header p {
            color: rgba(255, 255, 255, 0.55);
            font-size: 0.95rem;
        }
        .input-group {
            display: flex;
            gap: 0.75rem;
            margin-bottom: 2rem;
        }
        .input-group input {
            flex: 1;
            padding: 0.9rem 1.2rem;
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 1.2rem;
            background: rgba(255, 255, 255, 0.06);
            color: #fff;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.25s ease;
        }
        .input-group input::placeholder {
            color: rgba(255, 255, 255, 0.3);
        }
        .input-group input:focus {
            border-color: rgba(120, 160, 255, 0.5);
        }
        .input-group .btn-generate {
            padding: 0.9rem 1.8rem;
            border: none;
            border-radius: 1.2rem;
            background: linear-gradient(135deg, #5b7cfa, #7c5cfc);
            color: #fff;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.15s ease;
            box-shadow: 0 6px 18px rgba(91, 124, 250, 0.35);
            white-space: nowrap;
        }
        .input-group .btn-generate:hover {
            transform: translateY(-2px);
        }
        .error-msg {
            color: #f87171;
            font-size: 0.8rem;
            min-height: 1.4rem;
            text-align: center;
            margin-top: -0.8rem;
            margin-bottom: 0.6rem;
        }
        .qr-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 230px;
            margin-bottom: 1.8rem;
            padding: 0.5rem;
            border-radius: 1.8rem;
            background: rgba(255, 255, 255, 0.03);
            border: 1px dashed rgba(255, 255, 255, 0.06);
        }
        .qr-wrapper.has-qr {
            border-color: rgba(120, 160, 255, 0.15);
            background: rgba(255, 255, 255, 0.04);
        }
        #qrContainer {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 0.8rem;
        }
        .qr-box {
            background: #ffffff;
            padding: 24px;
            border-radius: 16px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
            display: inline-block;
        }
        #qrCanvas {
            display: block;
            width: 300px;
            height: 300px;
            border-radius: 4px;
            image-rendering: pixelated;
        }
        .qr-label {
            color: #ffffff;
            font-size: 0.85rem;
            font-weight: 400;
            text-align: center;
            max-width: 300px;
            word-break: break-all;
            padding: 0.4rem 0.8rem;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 8px;
        }
        .qr-placeholder {
            color: rgba(255, 255, 255, 0.25);
            font-size: 0.95rem;
            text-align: center;
            padding: 1.5rem 0;
        }
        .qr-placeholder span {
            display: block;
            font-size: 2.8rem;
            margin-bottom: 0.4rem;
        }
        .btn-download {
            display: none;
            width: 100%;
            padding: 0.9rem;
            border: none;
            border-radius: 1.2rem;
            background: linear-gradient(135deg, #2dd4bf, #14b8a6);
            color: #fff;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.15s ease;
            box-shadow: 0 6px 18px rgba(45, 212, 191, 0.3);
            margin-top: 0.2rem;
        }
        .btn-download.visible {
            display: block;
        }
        .btn-download:hover {
            transform: translateY(-2px);
        }
        .btn-download svg {
            display: inline-block;
            vertical-align: middle;
            margin-right: 0.5rem;
            width: 18px;
            height: 18px;
            fill: currentColor;
        }
        @media (max-width: 500px) {
            .card {
                padding: 1.8rem 1.4rem 2.2rem;
            }
            .input-group {
                flex-direction: column;
                gap: 0.6rem;
            }
            .input-group .btn-generate {
                width: 100%;
                padding: 0.8rem;
            }
            #qrCanvas {
                width: 240px;
                height: 240px;
            }
            .qr-box {
                padding: 16px;
            }
            .qr-label {
                max-width: 240px;
                font-size: 0.75rem;
            }
        }
    </style>
</head>

    <script>
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        // SIMPLE QR CODE GENERATOR (Pure JavaScript)
        // Uses the QR Code generation algorithm from Project Nayuki
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

        var qrcodegen = (function() {
            'use strict';

            function QrCode(ver, ecl, dataCodewords, msk) {
                if (ver < 1 || ver > 40)
                    throw new RangeError('Version out of range');
                if (msk < -1 || msk > 7)
                    throw new RangeError('Mask out of range');
                this.version = ver;
                this.errorCorrectionLevel = ecl;
                this.size = ver * 4 + 17;
                var row = [];
                for (var i = 0; i < this.size; i++)
                    row.push(false);
                this.modules = [];
                this.isFunction = [];
                for (var i = 0; i < this.size; i++) {
                    this.modules.push(row.slice());
                    this.isFunction.push(row.slice());
                }
                this.drawFunctionPatterns();
                var allCodewords = this.addEccAndInterleave(dataCodewords);
                this.drawCodewords(allCodewords);
                if (msk == -1) {
                    var minPenalty = Infinity;
                    for (var i = 0; i < 8; i++) {
                        this.applyMask(i);
                        this.drawFormatBits(i);
                        var penalty = this.getPenaltyScore();
                        if (penalty < minPenalty) {
                            minPenalty = penalty;
                            msk = i;
                        }
                        this.applyMask(i);
                    }
                }
                this.mask = msk;
                this.applyMask(msk);
                this.drawFormatBits(msk);
                this.isFunction = null;
            }

            QrCode.prototype = {
                drawFunctionPatterns: function() {
                    var size = this.size;
                    var modules = this.modules;
                    var isFunc = this.isFunction;
                    for (var i = 0; i < size; i++) {
                        for (var j = 0; j < size; j++) {
                            if (i == 0 || i == size - 1 || j == 0 || j == size - 1 ||
                                i == 6 || j == 6 ||
                                (j == 6 && i >= 8 && i <= size - 9) ||
                                (i == 6 && j >= 8 && j <= size - 9)) {
                                modules[i][j] = true;
                                isFunc[i][j] = true;
                            } else if (i >= 8 && i <= size - 9 && j >= 8 && j <= size - 9) {
                                // Data region
                            } else if (i < 9 && j < 9) {
                                if (i < 6 && j < 6) {
                                    modules[i][j] = ((i + j) % 2 == 0);
                                }
                                if (i < 6 && j == 6) {
                                    modules[i][j] = true;
                                }
                                if (i == 6 && j < 6) {
                                    modules[i][j] = true;
                                }
                                if (i < 6 && j > 6) {
                                    modules[i][j] = false;
                                }
                                if (i > 6 && j < 6) {
                                    modules[i][j] = false;
                                }
                                if (i == 6 && j == 6) {
                                    modules[i][j] = false;
                                }
                                if (i == 6 && j > 6) {
                                    modules[i][j] = true;
                                }
                                if (i > 6 && j == 6) {
                                    modules[i][j] = true;
                                }
                                if (i > 6 && j > 6) {
                                    modules[i][j] = false;
                                }
                                isFunc[i][j] = true;
                            } else if (i < 9 && j >= size - 8) {
                                if (i < 6) {
                                    modules[i][j] = ((i + j) % 2 == 0);
                                }
                                if (i == 6) {
                                    modules[i][j] = true;
                                }
                                if (i > 6) {
                                    modules[i][j] = false;
                                }
                                isFunc[i][j] = true;
                            } else if (i >= size - 8 && j < 9) {
                                if (j < 6) {
                                    modules[i][j] = ((i + j) % 2 == 0);
                                }
                                if (j == 6) {
                                    modules[i][j] = true;
                                }
                                if (j > 6) {
                                    modules[i][j] = false;
                                }
                                isFunc[i][j] = true;
                            } else if (i >= size - 8 && j >= size - 8) {
                                if (i < size - 6 && j < size - 6) {
                                    modules[i][j] = ((i + j) % 2 == 0);
                                } else {
                                    modules[i][j] = true;
                                }
                                isFunc[i][j] = true;
                            }
                        }
                    }
                },
                drawFormatBits: function(mask) {
                    var size = this.size;
                    var modules = this.modules;
                    var data = this.errorCorrectionLevel.formatBits << 3 | mask;
                    var rem = data;
                    for (var i = 0; i < 10; i++)
                        rem = (rem << 1) ^ ((rem >>> 9) * 0x537);
                    data = (data << 10) | rem;
                    data ^= 0x5412;
                    for (var i = 0; i <= 7; i++) {
                        var bit = ((data >>> i) & 1) != 0;
                        modules[8][i] = bit;
                        modules[size - 1 - i][8] = bit;
                    }
                    for (var i = 8; i <= 14; i++) {
                        var bit = ((data >>> i) & 1) != 0;
                        modules[8][size - 1 - (i - 8)] = bit;
                        modules[size - 1 - (i - 8)][8] = bit;
                    }
                    modules[8][size - 8] = true;
                },
                applyMask: function(mask) {
                    var size = this.size;
                    var modules = this.modules;
                    var isFunc = this.isFunction;
                    for (var y = 0; y < size; y++) {
                        for (var x = 0; x < size; x++) {
                            if (isFunc[y][x])
                                continue;
                            var invert = false;
                            switch (mask) {
                                case 0:
                                    invert = (x + y) % 2 == 0;
                                    break;
                                case 1:
                                    invert = y % 2 == 0;
                                    break;
                                case 2:
                                    invert = x % 3 == 0;
                                    break;
                                case 3:
                                    invert = (x + y) % 3 == 0;
                                    break;
                                case 4:
                                    invert = (Math.floor(y / 2) + Math.floor(x / 3)) % 2 == 0;
                                    break;
                                case 5:
                                    invert = (x * y) % 2 + (x * y) % 3 == 0;
                                    break;
                                case 6:
                                    invert = ((x * y) % 2 + (x * y) % 3) % 2 == 0;
                                    break;
                                case 7:
                                    invert = ((x + y) % 2 + (x * y) % 3) % 2 == 0;
                                    break;
                                default:
                                    throw new RangeError('Invalid mask');
                            }
                            modules[y][x] = modules[y][x] != invert;
                        }
                    }
                },
                getPenaltyScore: function() {
                    var modules = this.modules;
                    var size = this.size;
                    var penalty = 0;
                    for (var y = 0; y < size; y++) {
                        var runCount = 1;
                        var runColor = modules[y][0];
                        for (var x = 1; x < size; x++) {
                            if (modules[y][x] == runColor) {
                                runCount++;
                                if (runCount == 5) {
                                    penalty += 3;
                                } else if (runCount > 5) {
                                    penalty++;
                                }
                            } else {
                                runColor = modules[y][x];
                                runCount = 1;
                            }
                        }
                    }
                    for (var x = 0; x < size; x++) {
                        var runCount = 1;
                        var runColor = modules[0][x];
                        for (var y = 1; y < size; y++) {
                            if (modules[y][x] == runColor) {
                                runCount++;
                                if (runCount == 5) {
                                    penalty += 3;
                                } else if (runCount > 5) {
                                    penalty++;
                                }
                            } else {
                                runColor = modules[y][x];
                                runCount = 1;
                            }
                        }
                    }
                    for (var y = 0; y < size - 1; y++) {
                        for (var x = 0; x < size - 1; x++) {
                            var color = modules[y][x];
                            if (color == modules[y][x + 1] && color == modules[y + 1][x] && color == modules[y + 1][x + 1]) {
                                penalty += 3;
                            }
                        }
                    }
                    var dark = 0;
                    for (var y = 0; y < size; y++) {
                        for (var x = 0; x < size; x++) {
                            if (modules[y][x])
                                dark++;
                        }
                    }
                    var total = size * size;
                    var ratio = Math.floor(dark * 100 / total);
                    var prev = Math.abs(ratio - 50) / 5;
                    penalty += prev * 10;
                    return penalty;
                },
                drawCodewords: function(data) {
                    var size = this.size;
                    var modules = this.modules;
                    var isFunc = this.isFunction;
                    var i = 0;
                    for (var right = size - 1; right >= 1; right -= 2) {
                        if (right == 6)
                            right = 5;
                        for (var vert = 0; vert < size; vert++) {
                            for (var j = 0; j < 2; j++) {
                                var x = right - j;
                                var y = vert;
                                if (x < 0)
                                    break;
                                var upward = ((right + 1) & 2) == 0;
                                if (upward) {
                                    y = size - 1 - vert;
                                }
                                if (!isFunc[y][x] && i < data.length * 8) {
                                    modules[y][x] = ((data[i >> 3] >>> (7 - (i & 7))) & 1) != 0;
                                    i++;
                                }
                                if (j == 0) {
                                    if (x > 0)
                                        x--;
                                }
                            }
                        }
                    }
                },
                addEccAndInterleave: function(data) {
                    var ver = this.version;
                    var ecl = this.errorCorrectionLevel;
                    var rs = QrCode.getRsBlocks(ver, ecl);
                    var blocks = [];
                    var totalData = 0;
                    for (var i = 0; i < rs.length; i++) {
                        blocks.push([]);
                        totalData += rs[i].dataCount;
                    }
                    var dataIndex = 0;
                    for (var i = 0; i < rs.length; i++) {
                        for (var j = 0; j < rs[i].dataCount; j++) {
                            blocks[i][j] = data[dataIndex];
                            dataIndex++;
                        }
                    }
                    var result = [];
                    var totalEC = 0;
                    for (var i = 0; i < rs.length; i++) {
                        var block = blocks[i];
                        var ec = QrCode.getEcc(block, rs[i].totalCount - rs[i].dataCount);
                        for (var j = 0; j < ec.length; j++) {
                            block.push(ec[j]);
                        }
                        totalEC += ec.length;
                    }
                    var maxLen = 0;
                    for (var i = 0; i < blocks.length; i++) {
                        if (blocks[i].length > maxLen)
                            maxLen = blocks[i].length;
                    }
                    for (var i = 0; i < maxLen; i++) {
                        for (var j = 0; j < blocks.length; j++) {
                            if (i < blocks[j].length) {
                                result.push(blocks[j][i]);
                            }
                        }
                    }
                    return result;
                }
            };

                            totalCount: block.totalCount,
                            dataCount: block.dataCount,
                            eccCount: block.totalCount - block.dataCount
                        });
                    }
                }
                return blocks;

                    [1, 0, 905, 28],
                    [1, 0, 2021, 24],
                    [1, 0, 1597, 26],
                    [1, 0, 1209, 24],
                    [1, 0, 965, 28],
                    [1, 0, 2129, 26],
                    [1, 0, 1681, 24],
                    [1, 0, 1265, 26],
                    [1, 0, 1009, 28],
                    [1, 0, 2237, 26],
                    [1, 0, 1765, 24],
                    [1, 0, 1329, 26],
                    [1, 0, 1061, 28],
                    [1, 0, 2345, 26],
                    [1, 0, 1849, 24],
                    [1, 0, 1393, 26],
                    [1, 0, 1117, 28],
                    [1, 0, 2453, 26],
                    [1, 0, 1933, 24],
                    [1, 0, 1457, 26],
                    [1, 0, 1169, 28],
                    [1, 0, 2561, 26],
                    [1, 0, 2021, 24],
                    [1, 0, 1521, 26],
                    [1, 0, 1225, 28],
                    [1, 0, 2681, 26],
                    [1, 0, 2113, 24],
                    [1, 0, 1597, 26],
                    [1, 0, 1285, 28],
                    [1, 0, 2801, 26],
                    [1, 0, 2209, 24],
                    [1, 0, 1669, 26],
                    [1, 0, 1345, 28],
                    [1, 0, 2921, 26],
                    [1, 0, 2305, 24],
                    [1, 0, 1741, 26],
                    [1, 0, 1405, 28]
                ];
                var index = (ver - 1) * 4 + ecl.ordinal;
                var entry = data[index];
                var count = entry[0];
                var block1 = { totalCount: entry[2], dataCount: entry[3] };
                var block2 = { totalCount: entry[2] + 1, dataCount: entry[3] + 1 };
                for (var i = 0; i < count; i++) {
                    result.push(block1);
                }
                for (var i = count; i < entry[1]; i++) {
                    result.push(block2);
                }
                return result;
            };

            QrCode.getEcc = function(data, eccCount) {
                var rs = QrCode.getReedSolomon(eccCount);
                var result = rs.encode(data);
                return result;
            };

            QrCode.getReedSolomon = function(eccCount) {
                var g = [1];
                for (var i = 0; i < eccCount; i++) {
                    g = QrCode.multiply(g, [1, QrCode.antilog[i]]);
                }
                return {
                    encode: function(data) {
                        var result = data.slice();
                        for (var i = 0; i < eccCount; i++) {
                            result.push(0);
                        }
                        for (var i = 0; i < data.length; i++) {
                            var coef = result[i];
                            if (coef != 0) {
                                for (var j = 0; j < g.length; j++) {
                                    result[i + j] ^= QrCode.multiply(g[j], coef);
                                }
                            }
                        }
                        return result.slice(data.length);
                    }
                };
            };

            QrCode.multiply = function(a, b) {
                var result = [];
                for (var i = 0; i < a.length; i++) {
                    for (var j = 0; j < b.length; j++) {
                        var val = QrCode.multiply(a[i], b[j]);
                        if (result[i + j] === undefined) {
                            result[i + j] = val;
                        } else {
                            result[i + j] ^= val;
                        }
                    }
                }
                return result;
            };

            QrCode.multiply = function(a, b) {
                if (a == 0 || b == 0) return 0;
                var result = QrCode.log[a] + QrCode.log[b];
                if (result >= 255) result -= 255;
                return QrCode.antilog[result];
            };

            QrCode.log = [];
            QrCode.antilog = [];
            for (var i = 0; i < 255; i++) {
                QrCode.antilog[i] = (i == 0) ? 1 : QrCode.antilog[i - 1] * 2;
                if (QrCode.antilog[i] >= 256) {
                    QrCode.antilog[i] ^= 285;
                }
                QrCode.log[QrCode.antilog[i]] = i;
            }

            QrCode.Ecc = {
                LOW: { ordinal: 0, formatBits: 1 },
                MEDIUM: { ordinal: 1, formatBits: 0 },
                QUARTILE: { ordinal: 2, formatBits: 3 },
                HIGH: { ordinal: 3, formatBits: 2 }
            };

            QrCode.encodeText = function(text, ecl) {
                var data = [];
                for (var i = 0; i < text.length; i++) {
                    var code = text.charCodeAt(i);
                    if (code < 128) {
                        data.push(code);
                    } else if (code < 2048) {
                        data.push(0xC0 | (code >> 6));
                        data.push(0x80 | (code & 0x3F));
                    } else {
                        data.push(0xE0 | (code >> 12));
                        data.push(0x80 | ((code >> 6) & 0x3F));
                        data.push(0x80 | (code & 0x3F));
                    }
                }
                var ver = QrCode.getMinVersion(data.length, ecl);
                var capacity = QrCode.getCapacity(ver, ecl);
                var bits = [];
                bits.push(0x40);
                var lengthBits = (ver < 10) ? 8 : 16;
                for (var i = lengthBits - 1; i >= 0; i--) {
                    bits.push((data.length >>> i) & 1);
                }
                for (var i = 0; i < data.length; i++) {
                    for (var j = 7; j >= 0; j--) {
                        bits.push((data[i] >>> j) & 1);
                    }
                }
                var totalBits = bits.length;
                var dataCodewords = QrCode.getDataCodewords(ver, ecl);
                var totalBytes = dataCodewords;
                var remainingBits = totalBytes * 8 - bits.length;
                if (remainingBits > 0) {
                    bits.push(0);
                    remainingBits--;
                }
                while (remainingBits > 0) {
                    bits.push(0);
                    remainingBits--;
                }
                var byteData = [];
                for (var i = 0; i < bits.length; i += 8) {
                    var byte = 0;
                    for (var j = 0; j < 8; j++) {
                        byte = (byte << 1) | (bits[i + j] ? 1 : 0);
                    }
                    byteData.push(byte);
                }
                return new QrCode(ver, ecl, byteData, -1);
            };

            QrCode.getMinVersion = function(length, ecl) {
                for (var ver = 1; ver <= 40; ver++) {
                    var capacity = QrCode.getCapacity(ver, ecl);
                    if (capacity >= length) {
                        return ver;
                    }
                }
                throw new RangeError('Data too long');
            };

            QrCode.getCapacity = function(ver, ecl) {
                var total = 0;
                var blocks = QrCode.getBlockSizes(ver);
                for (var i = 0; i < blocks.length; i++) {
                    total += blocks[i].dataCount;
                }
                return total;
            };

            QrCode.getDataCodewords = function(ver, ecl) {
                var total = 0;
                var blocks = QrCode.getBlockSizes(ver);
                for (var i = 0; i < blocks.length; i++) {
                    total += blocks[i].dataCount;
                }
                return total;
            };

            return {
                encodeText: function(text, ecl) {
                    return QrCode.encodeText(text, ecl || QrCode.Ecc.LOW);
                }
            };
        })();

        // ─── UI Logic ───
        (function() {
            'use strict';

            const urlInput = document.getElementById('urlInput');
            const generateBtn = document.getElementById('generateBtn');
            const qrContainer = document.getElementById('qrContainer');
            const qrWrapper = document.getElementById('qrWrapper');
            const downloadBtn = document.getElementById('downloadBtn');
            const errorMsg = document.getElementById('errorMsg');

            let currentText = '';
            let currentCanvas = null;

            function showError(msg) {
                errorMsg.textContent = msg || '';
            }

            function clearError() {
                errorMsg.textContent = '';
            }

            function setPlaceholder(show) {
                if (show) {
                    qrContainer.innerHTML = `
                        <div class="qr-placeholder">
                            <span>⊞</span>
                            Enter a URL above
                        </div>
                    `;
                    qrWrapper.classList.remove('has-qr');
                    downloadBtn.disabled = true;
                    downloadBtn.classList.remove('visible');
                    currentCanvas = null;
                }
            }

            function drawQR(text) {
                const trimmed = text.trim();
                if (!trimmed) {
                    showError('Please enter a URL or text.');
                    return false;
                }

                clearError();

                // Clean up the URL: add https:// if missing
                let urlToEncode = trimmed;
                if (!urlToEncode.startsWith('http://') && !urlToEncode.startsWith('https://')) {
                    urlToEncode = 'https://' + urlToEncode;
                }

                qrContainer.innerHTML = '';

                const box = document.createElement('div');
                box.className = 'qr-box';
                qrContainer.appendChild(box);

                const canvas = document.createElement('canvas');
                canvas.id = 'qrCanvas';
                canvas.width = 300;
                canvas.height = 300;
                box.appendChild(canvas);

                const ctx = canvas.getContext('2d');

                try {
                    const qr = qrcodegen.encodeText(urlToEncode, qrcodegen.Ecc.LOW);
                    const size = qr.size;
                    const moduleSize = canvas.width / size;

                    ctx.fillStyle = '#ffffff';
                    ctx.fillRect(0, 0, canvas.width, canvas.height);

                    ctx.fillStyle = '#000000';
                    for (let y = 0; y < size; y++) {
                        for (let x = 0; x < size; x++) {
                            if (qr.modules[y][x]) {
                                ctx.fillRect(
                                    x * moduleSize,
                                    y * moduleSize,
                                    Math.ceil(moduleSize),
                                    Math.ceil(moduleSize)
                                );
                            }
                        }
                    }

                    currentCanvas = canvas;
                    currentText = urlToEncode;

                    const label = document.createElement('div');
                    label.className = 'qr-label';
                    label.textContent = urlToEncode;
                    qrContainer.appendChild(label);

                    qrWrapper.classList.add('has-qr');
                    downloadBtn.disabled = false;
                    downloadBtn.classList.add('visible');

                    return true;
                } catch (err) {
                    console.error('QR generation error:', err);
                    showError('Failed to generate QR code. Please try again.');
                    setPlaceholder(true);
                    return false;
                }
            }

            function downloadQR() {
                if (!currentCanvas || !currentText) {
                    showError('No QR code to download.');
                    return;
                }

                try {
                    const canvas = currentCanvas;
                    const qrSize = 300;
                    const padding = 30;
                    const labelSpace = 80;
                    const newWidth = qrSize + padding * 2;
                    const newHeight = qrSize + padding * 2 + labelSpace;

                    const paddedCanvas = document.createElement('canvas');
                    paddedCanvas.width = newWidth;
                    paddedCanvas.height = newHeight;
                    const ctx = paddedCanvas.getContext('2d');

                    const gradient = ctx.createRadialGradient(
                        newWidth / 2, newHeight / 2 - 20, 0,
                        newWidth / 2, newHeight / 2, newWidth * 0.7
                    );
                    gradient.addColorStop(0, '#1a2440');
                    gradient.addColorStop(1, '#0b1120');
                    ctx.fillStyle = gradient;
                    ctx.fillRect(0, 0, newWidth, newHeight);

                    ctx.drawImage(canvas, padding, padding, qrSize, qrSize);

                    const fontSize = 22;
                    ctx.font = `${fontSize}px "Segoe UI", "Helvetica Neue", Tahoma, sans-serif`;
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'top';

                    let displayText = currentText;
                    const maxWidth = newWidth - padding * 2 - 10;
                    if (ctx.measureText(displayText).width > maxWidth) {
                        while (ctx.measureText(displayText + '…').width > maxWidth && displayText.length > 1) {
                            displayText = displayText.slice(0, -1);
                        }
                        displayText += '…';
                    }

                    ctx.fillStyle = '#a0c0ff';
                    ctx.shadowColor = 'rgba(120, 160, 255, 0.2)';
                    ctx.shadowBlur = 8;
                    ctx.fillText(displayText, newWidth / 2, padding + qrSize + 12);
                    ctx.shadowBlur = 0;

                    ctx.font = `14px "Segoe UI", "Helvetica Neue", Tahoma, sans-serif`;
                    ctx.fillStyle = 'rgba(255,255,255,0.3)';
                    ctx.fillText('Scan me', newWidth / 2, padding + qrSize + 12 + fontSize + 8);

                    const dataUrl = paddedCanvas.toDataURL('image/png');
                    const link = document.createElement('a');
                    const filename = `qr-${displayText.slice(0, 20).replace(/[^a-zA-Z0-9]/g, '_') || 'code'}.png`;
                    link.download = filename;
                    link.href = dataUrl;
                    document.body.appendChild(link);
                    link.click();
                    document.body.removeChild(link);

                    const originalText = downloadBtn.textContent;
                    downloadBtn.textContent = '✓ Downloaded!';
                    setTimeout(() => {
                        downloadBtn.textContent = originalText;
                    }, 2000);

                } catch (err) {
                    console.error('Download error:', err);
                    showError('Failed to download image. Please try again.');
                }
            }

            function debounce(fn, delay) {
                let timer = null;
                return function(...args) {
                    clearTimeout(timer);
                    timer = setTimeout(() => fn.apply(this, args), delay);
                };
            }

            const debouncedGenerate = debounce(function() {
                const text = urlInput.value.trim();
                if (text && text !== currentText) {
                    drawQR(text);
                } else if (!text && currentText) {
                    setPlaceholder(true);
                    currentText = '';
                }
            }, 350);

            urlInput.addEventListener('input', function() {
                clearError();
                if (!this.value.trim()) {
                    if (currentText) {
                        setPlaceholder(true);
                        currentText = '';
                    }
                    return;
                }
                debouncedGenerate();
            });

            generateBtn.addEventListener('click', function(e) {
                e.preventDefault();
                const text = urlInput.value.trim();
                if (text) drawQR(text);
                else showError('Please enter a URL or text.');
            });

            urlInput.addEventListener('keydown', function(e) {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    const text = this.value.trim();
                    if (text) drawQR(text);
                    else showError('Please enter a URL or text.');
                }
            });

            downloadBtn.addEventListener('click', downloadQR);

            urlInput.addEventListener('paste', function() {
                setTimeout(() => {
                    const text = this.value.trim();
                    if (text) drawQR(text);
                }, 50);
            });

            setPlaceholder(true);
            setTimeout(() => urlInput.focus(), 300);
            console.log('✅ QR Code Generator ready');
        })();
    </script>
