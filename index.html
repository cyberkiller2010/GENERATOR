<!DOCTYPE html>
<html>
<head>
    <title>QR Generator</title>
    <script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js"></script>
</head>
<body style="font-family: sans-serif; max-width: 400px; margin: 50px auto; text-align: center;">
    <h1>QR Code Generator</h1>
    <input type="text" id="url" placeholder="Enter URL" style="width: 80%; padding: 10px;">
    <button onclick="generate()" style="padding: 10px 20px; margin: 10px;">Generate</button>
    <div id="qr" style="margin: 20px;"></div>
    <a id="download" style="display: none; padding: 10px 20px; background: #2dd4bf; color: white; text-decoration: none; border-radius: 8px;">Download</a>

    <script>
        function generate() {
            const text = document.getElementById('url').value.trim();
            if (!text) return alert('Enter a URL');

            const qr = qrcode(0, 'H');
            qr.addData(text);
            qr.make();

            const canvas = document.createElement('canvas');
            const size = qr.getModuleCount();
            const scale = 10;
            canvas.width = size * scale;
            canvas.height = size * scale;
            const ctx = canvas.getContext('2d');

            ctx.fillStyle = '#ffffff';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.fillStyle = '#000000';
            for (let row = 0; row < size; row++) {
                for (let col = 0; col < size; col++) {
                    if (qr.isDark(row, col)) {
                        ctx.fillRect(col * scale, row * scale, scale, scale);
                    }
                }
            }

            const container = document.getElementById('qr');
            container.innerHTML = '';
            container.appendChild(canvas);

            const download = document.getElementById('download');
            download.href = canvas.toDataURL('image/png');
            download.download = 'qr-code.png';
            download.style.display = 'inline-block';
        }
    </script>
</body>
</html>
