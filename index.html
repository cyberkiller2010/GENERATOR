<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Purple QR Generator</title>

  <!-- PWA -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#7b2cbf">

  <!-- QR Code Library -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      background: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 430px;
      text-align: center;
      padding: 35px 25px;
      border: 2px solid #7b2cbf;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(123, 44, 191, 0.15);
    }

    h1 {
      color: #7b2cbf;
      font-size: 32px;
      margin-bottom: 8px;
    }

    .subtitle {
      color: #666;
      margin-bottom: 25px;
    }

    input {
      width: 100%;
      padding: 15px;
      border: 2px solid #ddd;
      border-radius: 10px;
      outline: none;
      font-size: 16px;
      margin-bottom: 12px;
    }

    input:focus {
      border-color: #7b2cbf;
    }

    button {
      width: 100%;
      padding: 15px;
      border-radius: 10px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .generate-btn {
      border: none;
      background: #7b2cbf;
      color: white;
    }

    .generate-btn:hover {
      background: #5a189a;
    }

    .download-btn {
      margin-top: 15px;
      background: white;
      color: #7b2cbf;
      border: 2px solid #7b2cbf;
    }

    .download-btn:hover {
      background: #7b2cbf;
      color: white;
    }

    #preview {
      margin-top: 25px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    #qrcode {
      display: flex;
      justify-content: center;
    }

    #qrcode canvas {
      border: 3px solid #7b2cbf;
      border-radius: 10px;
      padding: 10px;
      background: white;
    }

    #qrLabel {
      margin-top: 10px;
      color: #7b2cbf;
      font-size: 18px;
      font-weight: bold;
      word-break: break-word;
    }

    .hidden {
      display: none;
    }

    .footer {
      margin-top: 25px;
      font-size: 13px;
      color: #999;
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>QR Generator</h1>

    <p class="subtitle">
      Turn any link or text into a QR code
    </p>

    <input
      type="text"
      id="qrText"
      placeholder="Paste a link or enter text..."
    >

    <input
      type="text"
      id="labelText"
      placeholder="Enter subtitle e.g. My Website"
    >

    <button class="generate-btn" onclick="generateQR()">
      Generate QR Code
    </button>

    <div id="preview" class="hidden">

      <div id="qrcode"></div>

      <div id="qrLabel"></div>

    </div>

    <button
      id="downloadBtn"
      class="download-btn hidden"
      onclick="downloadQR()"
    >
      Download QR Code
    </button>

    <p class="footer">
      Simple • Fast • Free
    </p>

  </div>

  <script>

    function generateQR() {

      const text = document.getElementById("qrText").value.trim();
      const label = document.getElementById("labelText").value.trim();

      const qrContainer = document.getElementById("qrcode");
      const qrLabel = document.getElementById("qrLabel");

      const preview = document.getElementById("preview");
      const downloadBtn = document.getElementById("downloadBtn");

      if (text === "") {
        alert("Please enter a link or some text.");
        return;
      }

      qrContainer.innerHTML = "";

      new QRCode(qrContainer, {
        text: text,
        width: 220,
        height: 220,
        colorDark: "#7b2cbf",
        colorLight: "#ffffff",
        correctLevel: QRCode.CorrectLevel.H
      });

      qrLabel.textContent = label;

      preview.classList.remove("hidden");
      downloadBtn.classList.remove("hidden");
    }


    function downloadQR() {

      const canvas = document.querySelector("#qrcode canvas");

      if (!canvas) {
        alert("Please generate a QR code first.");
        return;
      }

      const label =
        document.getElementById("labelText").value.trim()
        || "QR Code";

      const padding = 30;
      const labelHeight = 60;

      const finalCanvas = document.createElement("canvas");

      finalCanvas.width = canvas.width + padding * 2;
      finalCanvas.height =
        canvas.height + labelHeight + padding * 2;

      const ctx = finalCanvas.getContext("2d");

      // White background
      ctx.fillStyle = "#ffffff";

      ctx.fillRect(
        0,
        0,
        finalCanvas.width,
        finalCanvas.height
      );

      // QR code
      ctx.drawImage(
        canvas,
        padding,
        padding
      );

      // Subtitle
      ctx.fillStyle = "#7b2cbf";
      ctx.font = "bold 18px Arial";
      ctx.textAlign = "center";

      ctx.fillText(
        label,
        finalCanvas.width / 2,
        canvas.height + padding + 35
      );

      // Download
      const link = document.createElement("a");

      link.download = "purple-qrcode.png";

      link.href = finalCanvas.toDataURL("image/png");

      document.body.appendChild(link);

      link.click();

      document.body.removeChild(link);
    }


    // Enter key generates QR
    document.getElementById("qrText").addEventListener(
      "keydown",
      function(event) {

        if (event.key === "Enter") {
          generateQR();
        }

      }
    );


    // Register service worker
    if ("serviceWorker" in navigator) {

      window.addEventListener("load", function() {

        navigator.serviceWorker.register("./service-worker.js")
          .then(function() {
            console.log("Service Worker registered!");
          })
          .catch(function(error) {
            console.log(
              "Service Worker registration failed:",
              error
            );
          });

      });

    }

  </script>

</body>
  </html>
