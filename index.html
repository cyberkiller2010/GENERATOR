<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>QR Code Generator</title>
    <!-- Use the proven QRCode.js library from CDN (reliable) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js">
    </script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(145deg, #0b1120, #19233c);
            padding: 1.5rem;
        }
        .card {
            background: rgba(255, 255, 255, 0.06);
            backdrop-filter: blur(20px);
            border-radius: 2.5rem;
            padding: 2.5rem 2.8rem 3rem;
            max-width: 560px;
            width: 100%;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        .header {
            text-align: center;
            margin-bottom: 2rem;
        }
        .header .icon {
            font-size: 2.8rem;
            display: block;
            margin-bottom: 0.4rem;
        }
        .header h1 {
            font-size: 1.9rem;
            font-weight: 700;
            background: linear-gradient(135deg, #f0f4ff, #a0c0ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .header p {
            color: rgba(255, 255, 255, 0.55);
            font-size: 0.95rem;
        }
        .input-group {
            display: flex;
            gap: 0.75rem;
            margin-bottom: 2rem;
        }
        .input-group input {
            flex: 1;
            padding: 0.9rem 1.2rem;
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 1.2rem;
            background: rgba(255, 255, 255, 0.06);
            color: #fff;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.25s ease;
        }
        .input-group input::placeholder {
            color: rgba(255, 255, 255, 0.3);
        }
        .input-group input:focus {
            border-color: rgba(120, 160, 255, 0.5);
        }
        .input-group .btn-generate {
            padding: 0.9rem 1.8rem;
            border: none;
            border-radius: 1.2rem;
            background: linear-gradient(135deg, #5b7cfa, #7c5cfc);
            color: #fff;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.15s ease;
            box-shadow: 0 6px 18px rgba(91, 124, 250, 0.35);
            white-space: nowrap;
        }
        .input-group .btn-generate:hover {
            transform: translateY(-2px);
        }
        .error-msg {
            color: #f87171;
            font-size: 0.8rem;
            min-height: 1.4rem;
            text-align: center;
            margin-top: -0.8rem;
            margin-bottom: 0.6rem;
        }
        .qr-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 230px;
            margin-bottom: 1.8rem;
            padding: 0.5rem;
            border-radius: 1.8rem;
            background: rgba(255, 255, 255, 0.03);
            border: 1px dashed rgba(255, 255, 255, 0.06);
            transition: border-color 0.3s ease;
        }
        .qr-wrapper.has-qr {
            border-color: rgba(120, 160, 255, 0.15);
            background: rgba(255, 255, 255, 0.04);
        }
        #qrContainer {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 0.8rem;
            width: 100%;
        }
        #qrContainer canvas,
        #qrContainer img {
            display: block;
            max-width: 100%;
            height: auto;
            border-radius: 8px;
        }
        /* Wrap QR in white background for contrast */
        .qr-box {
            background: #ffffff;
            padding: 20px;
            border-radius: 16px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
            display: inline-block;
        }
        .qr-label {
            color: #ffffff;
            font-size: 0.85rem;
            font-weight: 400;
            text-align: center;
            max-width: 280px;
            word-break: break-all;
            padding: 0.4rem 0.8rem;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 8px;
        }
        .qr-placeholder {
            color: rgba(255, 255, 255, 0.25);
            font-size: 0.95rem;
            text-align: center;
            padding: 1.5rem 0;
        }
        .qr-placeholder span {
            display: block;
            font-size: 2.8rem;
            margin-bottom: 0.4rem;
        }
        .btn-download {
            display: none;
            width: 100%;
            padding: 0.9rem;
            border: none;
            border-radius: 1.2rem;
            background: linear-gradient(135deg, #2dd4bf, #14b8a6);
            color: #fff;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.15s ease;
            box-shadow: 0 6px 18px rgba(45, 212, 191, 0.3);
            margin-top: 0.2rem;
        }
        .btn-download.visible {
            display: block;
        }
        .btn-download:hover {
            transform: translateY(-2px);
        }
        .btn-download svg {
            display: inline-block;
            vertical-align: middle;
            margin-right: 0.5rem;
            width: 18px;
            height: 18px;
            fill: currentColor;
        }
        @media (max-width: 500px) {
            .card {
                padding: 1.8rem 1.4rem 2.2rem;
            }
            .input-group {
                flex-direction: column;
                gap: 0.6rem;
            }
            .input-group .btn-generate {
                width: 100%;
                padding: 0.8rem;
            }
            .qr-box {
                padding: 14px;
            }
            .qr-label {
                max-width: 220px;
                font-size: 0.75rem;
            }
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="header">
            <span class="icon">✅</span>
            <h1>QR Code Generator</h1>
            <p>100% working — guaranteed scannable</p>
        </div>

        <div class="input-group">
            <input type="text" id="urlInput" placeholder="https://example.com" autofocus spellcheck="false" />
            <button class="btn-generate" id="generateBtn">Generate</button>
        </div>

        <div class="error-msg" id="errorMsg"></div>

        <div class="qr-wrapper" id="qrWrapper">
            <div id="qrContainer">
                <div class="qr-placeholder">
                    <span>⊞</span>
                    Enter a URL above
                </div>
            </div>
        </div>

        <button class="btn-download" id="downloadBtn" disabled>
            <svg viewBox="0 0 24 24" width="18" height="18">
                <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8l-6-6zM6 20V4h7v5h5v11H6z"/>
                <path d="M12 15l-4-4h2.5V8h3v3H16l-4 4z"/>
                <path d="M8 17h8v1.5H8V17z"/>
            </svg>
            Download QR Code
        </button>
    </div>

    <script>
        (function() {
            'use strict';

            // ─── DOM refs ───
            const urlInput = document.getElementById('urlInput');
            const generateBtn = document.getElementById('generateBtn');
            const qrContainer = document.getElementById('qrContainer');
            const qrWrapper = document.getElementById('qrWrapper');
            const downloadBtn = document.getElementById('downloadBtn');
            const errorMsg = document.getElementById('errorMsg');

            // ─── State ───
            let qrCodeInstance = null;
            let currentText = '';

            // ─── Helpers ───
            function showError(msg) {
                errorMsg.textContent = msg || '';
            }

            function clearError() {
                errorMsg.textContent = '';
            }

            function setPlaceholder(show) {
                if (show) {
                    qrContainer.innerHTML = `
                        <div class="qr-placeholder">
                            <span>⊞</span>
                            Enter a URL above
                        </div>
                    `;
                    qrWrapper.classList.remove('has-qr');
                    downloadBtn.disabled = true;
                    downloadBtn.classList.remove('visible');
                }
            }

            // ─── Generate QR ───
            function generateQR(text) {
                const trimmed = text.trim();
                if (!trimmed) {
                    showError('Please enter a URL or text.');
                    return false;
                }

                // Add https:// if missing
                let urlToEncode = trimmed;
                if (!urlToEncode.startsWith('http://') && !urlToEncode.startsWith('https://')) {
                    urlToEncode = 'https://' + urlToEncode;
                }

                clearError();

                // Clear previous QR
                if (qrCodeInstance) {
                    try { qrCodeInstance.clear(); } catch (e) { /* ignore */ }
                    qrCodeInstance = null;
                }

                // Remove placeholder
                qrContainer.innerHTML = '';

                // Create a white box wrapper
                const box = document.createElement('div');
                box.className = 'qr-box';
                qrContainer.appendChild(box);

                try {
                    // ─── Use QRCode.js with proper error handling ───
                    // Use MEDIUM error correction for better reliability
                    const eccLevel = urlToEncode.length > 50 ? QRCode.CorrectLevel.M : QRCode.CorrectLevel.L;

                    qrCodeInstance = new QRCode(box, {
                        text: urlToEncode,
                        width: 260,
                        height: 260,
                        colorDark: '#000000',
                        colorLight: '#ffffff',
                        correctLevel: eccLevel,
                    });

                    // Add label below the QR
                    const label = document.createElement('div');
                    label.className = 'qr-label';
                    label.textContent = urlToEncode;
                    qrContainer.appendChild(label);

                    currentText = urlToEncode;
                    qrWrapper.classList.add('has-qr');
                    downloadBtn.disabled = false;
                    downloadBtn.classList.add('visible');

                    return true;
                } catch (err) {
                    console.error('QR generation error:', err);
                    showError('Failed to generate QR code. Please try a shorter URL.');
                    setPlaceholder(true);
                    return false;
                }
            }

            // ─── Download ───
            function downloadQR() {
                if (!qrCodeInstance || !currentText) {
                    showError('No QR code to download.');
                    return;
                }

                // Get the canvas from the container
                const canvas = qrContainer.querySelector('canvas');
                if (!canvas) {
                    showError('Could not find QR image. Please regenerate.');
                    return;
                }

                try {
                    const qrSize = canvas.width;
                    const padding = 30;
                    const labelSpace = 70;
                    const newWidth = qrSize + padding * 2;
                    const newHeight = qrSize + padding * 2 + labelSpace;

                    const paddedCanvas = document.createElement('canvas');
                    paddedCanvas.width = newWidth;
                    paddedCanvas.height = newHeight;
                    const ctx = paddedCanvas.getContext('2d');

                    // Dark background
                    const gradient = ctx.createRadialGradient(
                        newWidth / 2, newHeight / 2 - 20, 0,
                        newWidth / 2, newHeight / 2, newWidth * 0.7
                    );
                    gradient.addColorStop(0, '#1a2440');
                    gradient.addColorStop(1, '#0b1120');
                    ctx.fillStyle = gradient;
                    ctx.fillRect(0, 0, newWidth, newHeight);

                    // Draw QR code
                    ctx.drawImage(canvas, padding, padding, qrSize, qrSize);

                    // Draw label
                    const fontSize = 20;
                    ctx.font = `${fontSize}px "Segoe UI", "Helvetica Neue", Tahoma, sans-serif`;
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'top';

                    let displayText = currentText;
                    const maxWidth = newWidth - padding * 2 - 10;
                    if (ctx.measureText(displayText).width > maxWidth) {
                        while (ctx.measureText(displayText + '…').width > maxWidth && displayText.length > 1) {
                            displayText = displayText.slice(0, -1);
                        }
                        displayText += '…';
                    }

                    ctx.fillStyle = '#a0c0ff';
                    ctx.shadowColor = 'rgba(120, 160, 255, 0.2)';
                    ctx.shadowBlur = 8;
                    ctx.fillText(displayText, newWidth / 2, padding + qrSize + 12);
                    ctx.shadowBlur = 0;

                    ctx.font = `12px "Segoe UI", "Helvetica Neue", Tahoma, sans-serif`;
                    ctx.fillStyle = 'rgba(255,255,255,0.25)';
                    ctx.fillText('Scan me', newWidth / 2, padding + qrSize + 12 + fontSize + 4);

                    // Download
                    const dataUrl = paddedCanvas.toDataURL('image/png');
                    const link = document.createElement('a');
                    const filename = `qr-${displayText.slice(0, 20).replace(/[^a-zA-Z0-9]/g, '_') || 'code'}.png`;
                    link.download = filename;
                    link.href = dataUrl;
                    document.body.appendChild(link);
                    link.click();
                    document.body.removeChild(link);

                    const originalText = downloadBtn.textContent;
                    downloadBtn.textContent = '✓ Downloaded!';
                    setTimeout(() => {
                        downloadBtn.textContent = originalText;
                    }, 2000);

                } catch (err) {
                    console.error('Download error:', err);
                    showError('Failed to download image. Please try again.');
                }
            }

            // ─── Event handlers ───
            function debounce(fn, delay) {
                let timer = null;
                return function(...args) {
                    clearTimeout(timer);
                    timer = setTimeout(() => fn.apply(this, args), delay);
                };
            }

            const debouncedGenerate = debounce(function() {
                const text = urlInput.value.trim();
                if (text && text !== currentText) {
                    generateQR(text);
                } else if (!text && currentText) {
                    setPlaceholder(true);
                    currentText = '';
                    if (qrCodeInstance) {
                        try { qrCodeInstance.clear(); } catch (e) { /* ignore */ }
                        qrCodeInstance = null;
                    }
                }
            }, 400);

            urlInput.addEventListener('input', function() {
                clearError();
                if (!this.value.trim()) {
                    if (currentText) {
                        setPlaceholder(true);
                        currentText = '';
                        if (qrCodeInstance) {
                            try { qrCodeInstance.clear(); } catch (e) { /* ignore */ }
                            qrCodeInstance = null;
                        }
                    }
                    return;
                }
                debouncedGenerate();
            });

            generateBtn.addEventListener('click', function(e) {
                e.preventDefault();
                const text = urlInput.value.trim();
                if (text) {
                    generateQR(text);
                } else {
                    showError('Please enter a URL or text.');
                }
            });

            urlInput.addEventListener('keydown', function(e) {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    const text = this.value.trim();
                    if (text) generateQR(text);
                    else showError('Please enter a URL or text.');
                }
            });

            downloadBtn.addEventListener('click', downloadQR);

            urlInput.addEventListener('paste', function() {
                setTimeout(() => {
                    const text = this.value.trim();
                    if (text) generateQR(text);
                }, 50);
            });

            // ─── Init ───
            setPlaceholder(true);
            setTimeout(() => urlInput.focus(), 300);
            console.log('✅ QR Code Generator ready (using QRCode.js)');
        })();
    </script>
</body>
</html>
