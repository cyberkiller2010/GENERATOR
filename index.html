<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>QR Code Generator with Label</title>

    <!-- QRCode.js library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js">
    </script>

    <style>
        /* ─── Reset & Base ─── */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(145deg, #0b1120 0%, #19233c 100%);
            padding: 1.5rem;
        }

        /* ─── Card ─── */
        .card {
            background: rgba(255, 255, 255, 0.06);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 2.5rem;
            padding: 2.5rem 2.8rem 3rem;
            max-width: 580px;
            width: 100%;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.6),
                inset 0 1px 1px rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.05);
            transition: box-shadow 0.3s ease;
        }

        .card:hover {
            box-shadow: 0 40px 80px rgba(0, 0, 0, 0.7),
                inset 0 1px 1px rgba(255, 255, 255, 0.10);
        }

        /* ─── Header ─── */
        .header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .header .icon {
            font-size: 2.8rem;
            display: block;
            margin-bottom: 0.4rem;
        }

        .header h1 {
            font-size: 1.9rem;
            font-weight: 700;
            color: #ffffff;
            letter-spacing: -0.5px;
            background: linear-gradient(135deg, #f0f4ff, #a0c0ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .header p {
            color: rgba(255, 255, 255, 0.55);
            font-size: 0.95rem;
            margin-top: 0.3rem;
            font-weight: 400;
        }

        /* ─── Input Group ─── */
        .input-group {
            display: flex;
            gap: 0.75rem;
            margin-bottom: 2rem;
        }

        .input-group input {
            flex: 1;
            padding: 0.9rem 1.2rem;
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 1.2rem;
            background: rgba(255, 255, 255, 0.06);
            color: #fff;
            font-size: 1rem;
            font-weight: 400;
            outline: none;
            transition: border-color 0.25s ease, box-shadow 0.25s ease;
            box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.2);
        }

        .input-group input::placeholder {
            color: rgba(255, 255, 255, 0.3);
            font-weight: 300;
        }

        .input-group input:focus {
            border-color: rgba(120, 160, 255, 0.5);
            box-shadow: 0 0 0 3px rgba(120, 160, 255, 0.15),
                inset 0 2px 4px rgba(0, 0, 0, 0.2);
        }

        .input-group .btn-generate {
            padding: 0.9rem 1.8rem;
            border: none;
            border-radius: 1.2rem;
            background: linear-gradient(135deg, #5b7cfa, #7c5cfc);
            color: #fff;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.15s ease, box-shadow 0.25s ease;
            box-shadow: 0 6px 18px rgba(91, 124, 250, 0.35);
            white-space: nowrap;
        }

        .input-group .btn-generate:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 28px rgba(91, 124, 250, 0.45);
        }

        .input-group .btn-generate:active {
            transform: scale(0.96);
        }

        /* ─── QR Code Container ─── */
        .qr-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 230px;
            margin-bottom: 1.8rem;
            padding: 0.5rem 0.5rem 0.2rem;
            border-radius: 1.8rem;
            background: rgba(255, 255, 255, 0.03);
            border: 1px dashed rgba(255, 255, 255, 0.06);
            transition: border-color 0.3s ease, background 0.3s ease;
        }

        .qr-wrapper.has-qr {
            border-color: rgba(120, 160, 255, 0.15);
            background: rgba(255, 255, 255, 0.04);
        }

        #qrContainer {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 200px;
            width: 100%;
            gap: 0.5rem;
        }

        #qrContainer canvas,
        #qrContainer img {
            border-radius: 1rem;
            max-width: 100%;
            height: auto;
            display: block;
        }

        /* ─── QR Label (on webpage) ─── */
        .qr-label {
            color: rgba(255, 255, 255, 0.7);
            font-size: 0.85rem;
            font-weight: 400;
            text-align: center;
            max-width: 100%;
            word-break: break-all;
            padding: 0 0.5rem;
            margin-top: 0.2rem;
            letter-spacing: 0.2px;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .qr-placeholder {
            color: rgba(255, 255, 255, 0.2);
            font-size: 0.95rem;
            font-weight: 300;
            text-align: center;
            padding: 1.5rem 0;
            letter-spacing: 0.3px;
        }

        .qr-placeholder span {
            display: block;
            font-size: 2.8rem;
            margin-bottom: 0.4rem;
        }

        /* ─── Error message ─── */
        .error-msg {
            color: #f87171;
            font-size: 0.8rem;
            min-height: 1.4rem;
            text-align: center;
            margin-top: -0.8rem;
            margin-bottom: 0.6rem;
            font-weight: 400;
            transition: opacity 0.25s ease;
        }

        .error-msg:empty {
            opacity: 0;
        }

        /* ─── Download Button ─── */
        .btn-download {
            display: none;
            width: 100%;
            padding: 0.9rem;
            border: none;
            border-radius: 1.2rem;
            background: linear-gradient(135deg, #2dd4bf, #14b8a6);
            color: #fff;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.15s ease, box-shadow 0.25s ease;
            box-shadow: 0 6px 18px rgba(45, 212, 191, 0.3);
            margin-top: 0.2rem;
        }

        .btn-download.visible {
            display: block;
        }

        .btn-download:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 28px rgba(45, 212, 191, 0.4);
        }

        .btn-download:active {
            transform: scale(0.97);
        }

        .btn-download svg {
            display: inline-block;
            vertical-align: middle;
            margin-right: 0.5rem;
            width: 18px;
            height: 18px;
            fill: currentColor;
        }

        /* ─── Responsive ─── */
        @media (max-width: 500px) {
            .card {
                padding: 1.8rem 1.4rem 2.2rem;
                border-radius: 1.8rem;
            }

            .header h1 {
                font-size: 1.5rem;
            }

            .input-group {
                flex-direction: column;
                gap: 0.6rem;
            }

            .input-group .btn-generate {
                width: 100%;
                justify-content: center;
                padding: 0.8rem;
            }

            .qr-wrapper {
                min-height: 170px;
                padding: 0.2rem;
            }

            #qrContainer {
                min-height: 150px;
            }

            .btn-download {
                padding: 0.8rem;
                font-size: 0.95rem;
            }

            .qr-label {
                font-size: 0.75rem;
            }
        }

        @media (max-width: 380px) {
            .card {
                padding: 1.2rem 0.8rem 1.6rem;
            }

            .header .icon {
                font-size: 2rem;
            }
            .header h1 {
                font-size: 1.2rem;
            }
            .input-group input {
                padding: 0.7rem 1rem;
                font-size: 0.9rem;
            }
        }

        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.03);
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.15);
            border-radius: 10px;
        }
    </style>
</head>

<body>

    <div class="card">
        <!-- Header -->
        <div class="header">
            <span class="icon">📱</span>
            <h1>QR Code Generator</h1>
            <p>Paste a URL &amp; get your QR code instantly</p>
        </div>

        <!-- Input -->
        <div class="input-group">
            <input
            type="url"
            id="urlInput"
            placeholder="https://example.com"
            autofocus
            spellcheck="false"
            />
            <button class="btn-generate" id="generateBtn">Generate</button>
        </div>

        <!-- Error message -->
        <div class="error-msg" id="errorMsg"></div>

        <!-- QR Code Display + Label -->
        <div class="qr-wrapper" id="qrWrapper">
            <div id="qrContainer">
                <div class="qr-placeholder">
                    <span>⊞</span>
                    Enter a URL above
                </div>
            </div>
        </div>

        <!-- Download Button -->
        <button class="btn-download" id="downloadBtn" disabled>
            <svg viewBox="0 0 24 24" width="18" height="18">
                <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8l-6-6zM6 20V4h7v5h5v11H6z"/>
                <path d="M12 15l-4-4h2.5V8h3v3H16l-4 4z"/>
                <path d="M8 17h8v1.5H8V17z"/>
            </svg>
            Download QR Code
        </button>
    </div>

    <script>
        (function() {
            'use strict';

            // ─── DOM refs ───
            const urlInput = document.getElementById('urlInput');
            const generateBtn = document.getElementById('generateBtn');
            const qrContainer = document.getElementById('qrContainer');
            const qrWrapper = document.getElementById('qrWrapper');
            const downloadBtn = document.getElementById('downloadBtn');
            const errorMsg = document.getElementById('errorMsg');

            // ─── State ───
            let qrCodeInstance = null;
            let currentText = '';

            // ─── Helpers ───
            function showError(msg) {
                errorMsg.textContent = msg || '';
            }

            function clearError() {
                errorMsg.textContent = '';
            }

            function setPlaceholder(show) {
                if (show) {
                    qrContainer.innerHTML = `
                        <div class="qr-placeholder">
                            <span>⊞</span>
                            Enter a URL above
                        </div>
                    `;
                    qrWrapper.classList.remove('has-qr');
                }
            }

            // ─── Generate QR ───
            function generateQR(text) {
                const trimmed = text.trim();
                if (!trimmed) {
                    showError('Please enter a URL or text.');
                    return false;
                }

                // Simple URL validation (warn but still generate)
                let isValidUrl = false;
                try {
                    const url = new URL(trimmed);
                    isValidUrl = (url.protocol === 'http:' || url.protocol === 'https:');
                } catch (_) { /* ignore */ }

                if (!isValidUrl) {
                    showError('Not a valid HTTP/HTTPS URL – generating as plain text.');
                } else {
                    clearError();
                }

                // Clear container (remove placeholder, old QR, old label)
                qrContainer.innerHTML = '';

                try {
                    // Generate QR code (appends canvas to qrContainer)
                    qrCodeInstance = new QRCode(qrContainer, {
                        text: trimmed,
                        width: 220,
                        height: 220,
                        colorDark: '#ffffff',
                        colorLight: 'transparent',
                        correctLevel: QRCode.CorrectLevel.H,
                    });

                    // ─── Add label below the QR code (for webpage) ───
                    const label = document.createElement('div');
                    label.className = 'qr-label';
                    label.textContent = trimmed;
                    qrContainer.appendChild(label);

                    // Update state & UI
                    currentText = trimmed;
                    qrWrapper.classList.add('has-qr');
                    downloadBtn.disabled = false;
                    downloadBtn.classList.add('visible');

                    return true;
                } catch (err) {
                    console.error('QR generation error:', err);
                    showError('Failed to generate QR code. Please try again.');
                    setPlaceholder(true);
                    downloadBtn.disabled = true;
                    downloadBtn.classList.remove('visible');
                    currentText = '';
                    return false;
                }
            }

            // ─── Download QR (with label baked in) ───
            function downloadQR() {
                if (!qrCodeInstance || !currentText) {
                    showError('No QR code to download.');
                    return;
                }

                // Get the canvas from the QRCode instance
                const canvas = qrContainer.querySelector('canvas');
                if (!canvas) {
                    showError('Could not find QR image. Please regenerate.');
                    return;
                }

                try {
                    const qrSize = 220;
                    const padding = 30;
                    const labelSpace = 60; // space for label text
                    const newWidth = qrSize + padding * 2;
                    const newHeight = qrSize + padding * 2 + labelSpace;

                    const paddedCanvas = document.createElement('canvas');
                    paddedCanvas.width = newWidth;
                    paddedCanvas.height = newHeight;
                    const ctx = paddedCanvas.getContext('2d');

                    // ─── 1. Draw background (dark gradient) ───
                    const gradient = ctx.createRadialGradient(
                        newWidth / 2, newHeight / 2 - 20, 0,
                        newWidth / 2, newHeight / 2, newWidth * 0.7
                    );
                    gradient.addColorStop(0, '#1a2440');
                    gradient.addColorStop(1, '#0b1120');
                    ctx.fillStyle = gradient;
                    ctx.fillRect(0, 0, newWidth, newHeight);

                    // ─── 2. Draw QR code ───
                    ctx.drawImage(canvas, padding, padding, qrSize, qrSize);

                    // ─── 3. Draw label text (with truncation) ───
                    const fontSize = 20;
                    ctx.font = `${fontSize}px "Segoe UI", "Helvetica Neue", Tahoma, sans-serif`;
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'top';

                    let displayText = currentText;
                    const maxWidth = newWidth - padding * 2 - 10; // leave small margins

                    // Truncate text with "…" if too long
                    if (ctx.measureText(displayText).width > maxWidth) {
                        while (ctx.measureText(displayText + '…').width > maxWidth && displayText.length > 1) {
                            displayText = displayText.slice(0, -1);
                        }
                        displayText += '…';
                    }

                    ctx.fillStyle = '#a0c0ff'; // soft blue glow
                    ctx.shadowColor = 'rgba(120, 160, 255, 0.2)';
                    ctx.shadowBlur = 8;
                    ctx.fillText(displayText, newWidth / 2, padding + qrSize + 12);
                    ctx.shadowBlur = 0; // reset

                    // (optional) small sub-label
                    ctx.font = `12px "Segoe UI", "Helvetica Neue", Tahoma, sans-serif`;
                    ctx.fillStyle = 'rgba(255,255,255,0.25)';
                    ctx.fillText('Scan me', newWidth / 2, padding + qrSize + 12 + fontSize + 6);

                    // ─── 4. Trigger download ───
                    const dataUrl = paddedCanvas.toDataURL('image/png');
                    const link = document.createElement('a');
                    const filename = `qr-${displayText.slice(0, 20).replace(/[^a-zA-Z0-9]/g, '_') || 'code'}.png`;
                    link.download = filename;
                    link.href = dataUrl;
                    document.body.appendChild(link);
                    link.click();
                    document.body.removeChild(link);

                    // Feedback
                    const originalText = downloadBtn.textContent;
                    downloadBtn.textContent = '✓ Downloaded!';
                    setTimeout(() => {
                        downloadBtn.textContent = originalText;
                    }, 2000);

                } catch (err) {
                    console.error('Download error:', err);
                    showError('Failed to download image. Please try again.');
                }
            }

            // ─── Debounce (for auto-generate while typing) ───
            function debounce(fn, delay) {
                let timer = null;
                return function(...args) {
                    clearTimeout(timer);
                    timer = setTimeout(() => fn.apply(this, args), delay);
                };
            }

            const debouncedGenerate = debounce(function() {
                const text = urlInput.value.trim();
                if (text && text !== currentText) {
                    generateQR(text);
                } else if (!text && currentText) {
                    // Reset UI if input is cleared
                    setPlaceholder(true);
                    downloadBtn.disabled = true;
                    downloadBtn.classList.remove('visible');
                    currentText = '';
                    if (qrCodeInstance) {
                        qrCodeInstance.clear();
                        qrCodeInstance = null;
                    }
                    clearError();
                }
            }, 350);

            // ─── Event Listeners ───
            urlInput.addEventListener('input', function() {
                clearError();
                if (!this.value.trim()) {
                    // If empty, reset to placeholder
                    if (currentText) {
                        setPlaceholder(true);
                        downloadBtn.disabled = true;
                        downloadBtn.classList.remove('visible');
                        currentText = '';
                        if (qrCodeInstance) {
                            qrCodeInstance.clear();
                            qrCodeInstance = null;
                        }
                    }
                    return;
                }
                debouncedGenerate();
            });

            generateBtn.addEventListener('click', function(e) {
                e.preventDefault();
                const text = urlInput.value.trim();
                if (text) generateQR(text);
                else showError('Please enter a URL or text.');
            });

            urlInput.addEventListener('keydown', function(e) {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    const text = this.value.trim();
                    if (text) generateQR(text);
                    else showError('Please enter a URL or text.');
                }
            });

            downloadBtn.addEventListener('click', downloadQR);

            // Paste support
            urlInput.addEventListener('paste', function() {
                setTimeout(() => {
                    const text = this.value.trim();
                    if (text) generateQR(text);
                }, 50);
            });

            // Blur support
            urlInput.addEventListener('blur', function() {
                const text = this.value.trim();
                if (text && text !== currentText) {
                    generateQR(text);
                }
            });

            // ─── Initial state ───
            setPlaceholder(true);
            setTimeout(() => urlInput.focus(), 300);

            console.log('✅ QR Code Generator with labels ready!');
        })();
    </script>
</body>
</html>
